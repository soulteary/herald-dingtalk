name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to build or rebuild (for example v1.1.0)'
        required: true
        type: string
      update_aliases:
        description: 'Also move stable major/minor/latest image aliases'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # Serialize rebuilds of the same immutable tag without using a repository-wide
  # pending slot that can discard a different tag's queued release.
  group: ${{ github.repository }}-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      stable: ${{ steps.release.outputs.stable }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve release ref
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_RELEASE_TAG}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Docker tags cannot contain SemVer build metadata (`+...`), so the
          # release contract accepts stable or pre-release SemVer only.
          SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*)))*)?$'
          if ! printf '%s\n' "$TAG" | grep -Eq "$SEMVER_RE"; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/${TAG}^{commit}")" ]; then
              echo "Checked-out commit does not match $TAG"
              exit 1
            fi
          fi

          STABLE=false
          if [[ "$TAG" != *-* ]]; then
            STABLE=true
          fi

          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          RELEASE_EXISTS="$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { id } } }' \
            -F owner="${GITHUB_REPOSITORY_OWNER}" \
            -F name="${REPOSITORY_NAME}" \
            -F tag="${TAG}" \
            --jq '.data.repository.release != null')"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "manual=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Verify release commit belongs to main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "Release tag ${{ steps.release.outputs.tag }} is not on main"
            exit 1
          fi

      - name: Set up Go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -count=1 -v -race ./...

      - name: Extract version information
        id: version
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION=${TAG#v}
          COMMIT=$(git rev-parse HEAD)
          BUILD_DATE=$(git show -s --format=%cI HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Build multi-platform binaries
        run: |
          mkdir -p dist
          VERSION=${{ steps.version.outputs.version }}
          COMMIT=${{ steps.version.outputs.commit }}
          BUILD_DATE=${{ steps.version.outputs.build_date }}
          LDFLAGS="-s -w -X 'github.com/soulteary/version-kit/v2.Version=${VERSION}' -X 'github.com/soulteary/version-kit/v2.Commit=${COMMIT}' -X 'github.com/soulteary/version-kit/v2.BuildDate=${BUILD_DATE}'"

          # Verify the linker symbols before producing cross-platform artifacts.
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-verify .
          ACTUAL_VERSION=$(./dist/herald-dingtalk-verify --version)
          if [ "$ACTUAL_VERSION" != "$VERSION" ]; then
            echo "Version metadata mismatch: got '$ACTUAL_VERSION', want '$VERSION'"
            exit 1
          fi
          rm dist/herald-dingtalk-verify

          # Build for multiple platforms
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-linux-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-darwin-arm64 .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-windows-arm64.exe .

      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs sha256sum > checksums.txt
          sha256sum --check checksums.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Create Release
        if: steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Downloads

            ### Docker Image
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ```

            ### Binaries
            - Linux AMD64: `herald-dingtalk-linux-amd64`
            - Linux ARM64: `herald-dingtalk-linux-arm64`
            - macOS AMD64: `herald-dingtalk-darwin-amd64`
            - macOS ARM64: `herald-dingtalk-darwin-arm64`
            - Windows AMD64: `herald-dingtalk-windows-amd64.exe`
            - Windows ARM64: `herald-dingtalk-windows-arm64.exe`

            ### Checksums
            See `checksums.txt` for SHA256 checksums.
          draft: false
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
          # The serialized alias job promotes the newest eligible stable
          # release after reconciling all published tags.
          make_latest: false
          overwrite_files: true

      - name: Update existing Release assets
        if: steps.release.outputs.exists == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
          # Do not pass body, generate_release_notes, or make_latest when
          # rebuilding: preserve notes and never move Latest from stale state.
          overwrite_files: true

  publish-aliases:
    name: Publish shared release aliases
    needs: release
    if: ${{ always() && needs.release.result == 'success' && needs.release.outputs.stable == 'true' && (github.event_name != 'workflow_dispatch' || inputs.update_aliases) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # Only this convergent job mutates shared aliases. GitHub may replace an
    # older pending job, so every surviving job reconciles all published stable
    # release series instead of assuming its own tag is the only one to update.
    concurrency:
      group: ${{ github.repository }}-release-aliases
      cancel-in-progress: false

    steps:
      - name: Checkout release tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconcile published stable aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin main:refs/remotes/origin/main
          STABLE_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          declare -A MAJOR_TAGS
          declare -A MINOR_TAGS
          LATEST_TAG=""
          LATEST_RELEASE_ID=""
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"

          while IFS= read -r TAG; do
            [ -n "${TAG}" ] || continue
            if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
              echo "Skipping ${TAG}: release commit is not on main"
              continue
            fi
            RELEASE_STATE="$(gh api graphql \
              -f query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { databaseId isDraft } } }' \
              -F owner="${GITHUB_REPOSITORY_OWNER}" \
              -F name="${REPOSITORY_NAME}" \
              -F tag="${TAG}" \
              --jq 'if .data.repository.release == null then "missing" elif .data.repository.release.isDraft then "draft" else (.data.repository.release.databaseId | tostring) end')"
            if [ "${RELEASE_STATE}" = "missing" ] || [ "${RELEASE_STATE}" = "draft" ]; then
              echo "Skipping ${TAG}: release is ${RELEASE_STATE}"
              continue
            fi
            RELEASE_ID="${RELEASE_STATE}"
            SOURCE="${REGISTRY}/${IMAGE_NAME}:${TAG}"
            if ! docker buildx imagetools inspect "${SOURCE}" >/dev/null 2>&1; then
              echo "Skipping ${TAG}: immutable image is unavailable"
              continue
            fi

            VERSION="${TAG#v}"
            MAJOR="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MINOR="${MAJOR}.${REST%%.*}"
            if [ -z "${LATEST_TAG}" ]; then
              LATEST_TAG="${TAG}"
              LATEST_RELEASE_ID="${RELEASE_ID}"
            fi
            if [ -z "${MAJOR_TAGS[${MAJOR}]+x}" ]; then
              MAJOR_TAGS["${MAJOR}"]="${TAG}"
            fi
            if [ -z "${MINOR_TAGS[${MINOR}]+x}" ]; then
              MINOR_TAGS["${MINOR}"]="${TAG}"
            fi
          done < <(git tag --list 'v*' | grep -E "${STABLE_RE}" | sort -Vr || true)

          if [ -z "${LATEST_TAG}" ]; then
            echo "No eligible published stable image exists"
            exit 1
          fi

          for MAJOR in "${!MAJOR_TAGS[@]}"; do
            TAG="${MAJOR_TAGS[${MAJOR}]}"
            docker buildx imagetools create \
              --tag "${REGISTRY}/${IMAGE_NAME}:${MAJOR}" \
              "${REGISTRY}/${IMAGE_NAME}:${TAG}"
          done
          for MINOR in "${!MINOR_TAGS[@]}"; do
            TAG="${MINOR_TAGS[${MINOR}]}"
            docker buildx imagetools create \
              --tag "${REGISTRY}/${IMAGE_NAME}:${MINOR}" \
              "${REGISTRY}/${IMAGE_NAME}:${TAG}"
          done
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}:${LATEST_TAG}"

          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${LATEST_RELEASE_ID}" \
            -f make_latest=true >/dev/null
