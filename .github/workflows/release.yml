name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to build or rebuild (for example v1.1.0)'
        required: true
        type: string
      update_aliases:
        description: 'Also move stable major/minor/latest image aliases'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # Releases update shared major/minor/latest aliases. Serialize every release
  # so an older run cannot finish last and overwrite aliases from a newer tag.
  group: ${{ github.repository }}-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve release ref
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_RELEASE_TAG}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Docker tags cannot contain SemVer build metadata (`+...`), so the
          # release contract accepts stable or pre-release SemVer only.
          SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*)))*)?$'
          if ! printf '%s\n' "$TAG" | grep -Eq "$SEMVER_RE"; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/${TAG}^{commit}")" ]; then
              echo "Checked-out commit does not match $TAG"
              exit 1
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "manual=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - name: Verify release commit belongs to main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "Release tag ${{ steps.release.outputs.tag }} is not on main"
            exit 1
          fi

      - name: Set up Go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -count=1 -v -race ./...

      - name: Extract version information
        id: version
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION=${TAG#v}
          COMMIT=$(git rev-parse HEAD)
          BUILD_DATE=$(git show -s --format=%cI HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Build multi-platform binaries
        run: |
          mkdir -p dist
          VERSION=${{ steps.version.outputs.version }}
          COMMIT=${{ steps.version.outputs.commit }}
          BUILD_DATE=${{ steps.version.outputs.build_date }}
          LDFLAGS="-s -w -X 'github.com/soulteary/version-kit/v2.Version=${VERSION}' -X 'github.com/soulteary/version-kit/v2.Commit=${COMMIT}' -X 'github.com/soulteary/version-kit/v2.BuildDate=${BUILD_DATE}'"

          # Verify the linker symbols before producing cross-platform artifacts.
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-verify .
          ACTUAL_VERSION=$(./dist/herald-dingtalk-verify --version)
          if [ "$ACTUAL_VERSION" != "$VERSION" ]; then
            echo "Version metadata mismatch: got '$ACTUAL_VERSION', want '$VERSION'"
            exit 1
          fi
          rm dist/herald-dingtalk-verify

          # Build for multiple platforms
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-linux-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-darwin-arm64 .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/herald-dingtalk-windows-arm64.exe .

      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs sha256sum > checksums.txt
          sha256sum --check checksums.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ !contains(steps.release.outputs.tag, '-') && (github.event_name != 'workflow_dispatch' || inputs.update_aliases) }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }},enable=${{ !contains(steps.release.outputs.tag, '-') && (github.event_name != 'workflow_dispatch' || inputs.update_aliases) }}
            type=raw,value=latest,enable=${{ !contains(steps.release.outputs.tag, '-') && (github.event_name != 'workflow_dispatch' || inputs.update_aliases) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Delete existing release for rebuild
        if: steps.release.outputs.manual == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Keep the immutable Git tag; only replace the release and its assets.
          gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Downloads

            ### Docker Image
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ```

            ### Binaries
            - Linux AMD64: `herald-dingtalk-linux-amd64`
            - Linux ARM64: `herald-dingtalk-linux-arm64`
            - macOS AMD64: `herald-dingtalk-darwin-amd64`
            - macOS ARM64: `herald-dingtalk-darwin-arm64`
            - Windows AMD64: `herald-dingtalk-windows-amd64.exe`
            - Windows ARM64: `herald-dingtalk-windows-arm64.exe`

            ### Checksums
            See `checksums.txt` for SHA256 checksums.
          draft: false
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
