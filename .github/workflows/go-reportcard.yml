name: Go Report Card

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/goreportcard.svg'
      - '.github/goreportcard-report.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: go-report-card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: grc
        uses: soulteary/goreportcard-action@739d8af6eb6bbd62d7ab521523415d3e5c53b70e # v1.0.0
        with:
          directory: "."
          output: ".github/goreportcard.svg"
          report: "true"
          report_output: ".github/goreportcard-report.md"
          threshold: "90"
          commit: "true"
          version: "v1.0.0"
      - run: echo "Grade ${{ steps.grc.outputs.grade }} (${{ steps.grc.outputs.score }}%)"
